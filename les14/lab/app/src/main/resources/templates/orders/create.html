<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2 class="mb-4">Создание заказа</h2>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form th:action="@{/orders}" th:object="${orderForm}" method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label" for="customerId">Клиент</label>
        <select id="customerId" class="form-select" th:field="*{customerId}" required>
            <option value="">Выберите клиента</option>
            <option th:each="c : ${customers}" th:value="${c.customerId}" th:text="${c.name}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="shippingAddress">Адрес доставки</label>
        <input id="shippingAddress" type="text" class="form-control" th:field="*{shippingAddress}" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="productId">Товар</label>
        <select id="productId" class="form-select" th:field="*{productId}" required>
            <option value="">Выберите товар</option>
            <option th:each="p : ${products}" th:value="${p.productId}"
                    th:text="${p.name + ' (' + p.price + ' руб.)'}"></option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="quantity">Количество</label>
        <input id="quantity" type="number" min="1" class="form-control" th:field="*{quantity}" required>
    </div>
    <button type="submit" class="btn btn-primary">Создать</button>
    <a th:href="@{/orders}" class="btn btn-secondary">Отмена</a>
</form>
</body>
</html>
