<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>Список заказов</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Courier New", "Rajdhani", monospace;
        margin: 0;
        padding: 20px;
        background: #0a0a0f;
        min-height: 100vh;
        color: #c8d0e0;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: #0d0d12;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #00c8ff;
        box-shadow: 0 0 15px rgba(0, 200, 255, 0.1);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #2a2a3a;
      }

      h1 {
        color: #00c8ff;
        font-size: 24px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 8px #00c8ff;
        margin: 0;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 12px;
      }

      .user-name {
        color: #00ff80;
        text-shadow: 0 0 4px #00ff80;
      }

      .btn-logout {
        background: #2a1a2a;
        color: #ff3060;
        border: 1px solid #ff3060;
        padding: 6px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-family: monospace;
      }

      .btn-logout:hover {
        background: #ff3060;
        color: white;
      }

      h2 {
        color: #8000ff;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 20px 0 15px;
        text-shadow: 0 0 5px #8000ff;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid #2a2a3a;
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background: #1a1a2a;
        color: #00c8ff;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      tr:nth-child(even) td {
        background-color: #0f0f17;
      }

      tr:hover td {
        background-color: #1a1a2a;
      }

      .btn {
        background: #8000ff;
        color: white;
        padding: 8px 20px;
        text-decoration: none;
        border-radius: 4px;
        display: inline-block;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: none;
        cursor: pointer;
      }

      .btn:hover {
        background: #00c8ff;
        color: #0a0a0f;
      }

      .btn-small {
        background: #2a2a3a;
        color: #00c8ff;
        padding: 4px 10px;
        text-decoration: none;
        border-radius: 3px;
        font-size: 11px;
        border: 1px solid #00c8ff;
      }

      .btn-small:hover {
        background: #00c8ff;
        color: #0a0a0f;
      }

      .status-NEW {
        color: #ffaa00;
        font-weight: bold;
        text-shadow: 0 0 4px #ffaa00;
      }

      .status-PAID {
        color: #00ff80;
        font-weight: bold;
        text-shadow: 0 0 4px #00ff80;
      }

      .status-CANCELLED {
        color: #ff3060;
        font-weight: bold;
        text-shadow: 0 0 4px #ff3060;
      }

      .status-PROCESSING {
        color: #00c8ff;
        font-weight: bold;
        text-shadow: 0 0 4px #00c8ff;
      }

      .status-SHIPPED {
        color: #8000ff;
        font-weight: bold;
        text-shadow: 0 0 4px #8000ff;
      }

      .status-DELIVERED {
        color: #00ff80;
        font-weight: bold;
        text-shadow: 0 0 4px #00ff80;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Управление заказами</h1>
        <div class="user-info">
          <span
            >ПОЛЬЗОВАТЕЛЬ:
            <span class="user-name" sec:authentication="name">user</span></span
          >
          <form th:action="@{/logout}" method="post" style="display: inline">
            <button type="submit" class="btn-logout">[ ВЫЙТИ ]</button>
          </form>
        </div>
      </div>

      <!-- Только MANAGER может создавать заказы -->
      <div sec:authorize="hasRole('MANAGER')">
        <a href="/devicestore/orders/new" class="btn">+ СОЗДАТЬ НОВЫЙ ЗАКАЗ</a>
      </div>

      <h2>Список заказов</h2>

      <table>
        <thead>
          <tr>
            <th>№ заказа</th>
            <th>Клиент</th>
            <th>Дата</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.customer.name}">Иван Петров</td>
            <td
              th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"
            >
              16.03.2026 12:00
            </td>
            <td th:text="${order.totalPrice} + ' руб.'">1000 руб.</td>
            <td>
              <span
                th:text="${order.status}"
                th:class="${'status-' + order.status}"
                >NEW</span
              >
            </td>
            <td>
              <a th:href="@{/orders/{id}(id=${order.id})}" class="btn-small"
                >ДЕТАЛИ</a
              >
            </td>
          </tr>
          <tr th:if="${orders.empty}">
            <td
              colspan="6"
              style="text-align: center; padding: 30px; color: #555"
            >
              [ ЗАКАЗОВ НЕТ ]
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
