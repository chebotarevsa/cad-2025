<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Зоомагазин — Вход</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="card shadow" style="width:380px">
        <div class="card-body p-4">
            <h4 class="card-title mb-4 text-center">Вход в систему</h4>

            <div th:if="${param.error}" class="alert alert-danger">
                Неверное имя пользователя или пароль.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Вы успешно вышли из системы.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Пользователь</label>
                    <input type="text" id="username" name="username"
                           class="form-control" placeholder="user / manager" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password"
                           class="form-control" placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Войти</button>
                </div>
            </form>

            <hr class="my-3">
            <p class="text-muted text-center small mb-0">
                <strong>user</strong> / user123 — просмотр<br>
                <strong>manager</strong> / manager123 — полный доступ
            </p>
        </div>
    </div>
</div>
</body>
</html>
