<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка доступа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffe4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #4a2c3a;
        }
        .error-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ffb6c1;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h2 { color: #c71585; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        a:hover { background: #ff1493; }
    </style>
</head>
<body>
<div class="error-box">
    <h2>Доступ запрещен</h2>
    <p th:text="${errorMessage}">У вас нет прав для выполнения этого действия!</p>
    <a th:href="@{/}">Вернуться к задачам</a>
</div>
</body>
</html>
