<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <style>
        body {
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: Arial, sans-serif;
        color: #4a2c3a;
        background: #ffe4ec;
    }

    h1, h2 {
        margin-bottom: 16px;
        color: #c71585;
    }

    ul {
        padding: 0;
        list-style: none;
    }

    li, .add-form {
        margin-bottom: 12px;
        padding: 16px;
        border: 2px solid #ffb6c1;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 4px 8px rgba(255, 105, 180, 0.2);
    }

    .task-title {
        font-weight: bold;
        color: #d81b60;
    }

    .task-description {
        margin: 6px 0;
        color: #7a5567;
    }

    .task-date {
        margin: 6px 0;
        font-size: 0.9em;
        color: #c71585;
        font-weight: bold;
    }

    .completed .task-title,
    .completed .task-description,
    .completed .task-date {
        text-decoration: line-through;
        color: #a0a0a0;
    }

    form {
        margin-top: 10px;
    }

    .task-meta {
        margin: 6px 0;
        font-size: 0.9em;
        color: #7a5567;
    }

    .subtasks {
        margin: 10px 0 0;
        padding: 0;
    }

    .subtasks li {
        margin: 6px 0;
        padding: 8px 12px;
        border-width: 1px;
        box-shadow: none;
        font-size: 0.95em;
    }

    .subtasks li.completed {
        text-decoration: line-through;
        color: #a0a0a0;
    }

    .inline-form input[type="text"] {
        display: inline-block;
        width: 60%;
        margin: 0 6px 0 0;
    }

    label, input, select {
        display: block;
        width: 100%;
        box-sizing: border-box;
    }

    label {
        color: #c71585;
        font-weight: bold;
    }

    input, select {
        margin: 5px 0 12px;
        padding: 10px;
        border: 2px solid #ffb6c1;
        border-radius: 8px;
        outline: none;
        background-color: #fff0f5;
        color: #4a2c3a;
        font-family: Arial, sans-serif;
    }

    input:focus, select:focus {
        border-color: #ff69b4;
        box-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: invert(30%) sepia(80%) saturate(2000%) hue-rotate(300deg) brightness(100%) contrast(100%);
    }

    button, .delete-link {
        display: inline-block;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #ff69b4;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.3s;
        font-size: 14px;
    }

    button:hover, .delete-link:hover {
        background: #ff1493;
    }

    .delete-link {
        margin-top: 10px;
        background: #db7093;
    }

    .delete-link:hover {
        background: #c71585;
    }
    </style>
</head>
<body>
<h1>Список задач</h1>

<p th:if="${tasks.isEmpty()}">Задач пока нет.</p>

<ul>
    <li th:each="task : ${tasks}" th:classappend="${task.completed} ? 'completed'">
        <div class="task-title" th:text="${task.title}"></div>
        <div class="task-description" th:text="${task.description}"></div>

        <div class="task-date" th:if="${task.dueDate != null}">
            Срок: <span th:text="${task.dueDate}"></span>
        </div>

        <div class="task-meta">
            Приоритет: <span th:text="${task.priority?.label}"></span>
            <span th:if="${task.category != null}">
                | Категория: <span th:text="${task.category}"></span>
            </span>
            <span th:if="${task.owner != null}">
                | Автор: <span th:text="${task.owner.name}"></span>
            </span>
            <span th:if="${task.createdAt != null}">
                | Создана: <span th:text="${#temporals.format(task.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
            </span>
        </div>

        <div th:text="${task.completed} ? 'Выполнена' : 'Не выполнена'"></div>

        <form th:if="${!task.completed}"
              th:action="@{/updateTask/{id}(id=${task.id})}" method="post">
            <input type="hidden" name="completed" value="true">
            <button type="submit">Отметить выполненной</button>
        </form>

        <ul class="subtasks">
            <li th:each="sub : ${task.subTasks}" th:classappend="${sub.completed} ? 'completed'">
                <span th:text="${sub.description}"></span>
                <form th:if="${!sub.completed}" style="display:inline"
                      th:action="@{/updateSubTask/{id}(id=${sub.id})}" method="post">
                    <input type="hidden" name="completed" value="true">
                    <button type="submit">Готово</button>
                </form>
            </li>
        </ul>

        <form class="inline-form" th:action="@{/addSubTask/{id}(id=${task.id})}" method="post">
            <input type="text" name="description" placeholder="Новая подзадача" required>
            <button type="submit">Добавить подзадачу</button>
        </form>

        <a class="delete-link"
           th:href="@{/deleteTask/{id}(id=${task.id})}">Удалить</a>
    </li>
</ul>

<h2>Добавить задачу</h2>
<form class="add-form" th:action="@{/addTask}" method="post">
    <label for="title">Название:</label>
    <input type="text" id="title" name="title" required>

    <label for="description">Описание:</label>
    <input type="text" id="description" name="description">

    <label for="dueDate">Срок выполнения:</label>
    <input type="date" id="dueDate" name="dueDate">

    <label for="priority">Приоритет:</label>
    <select id="priority" name="priority">
        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}"
                th:selected="${p.name() == 'MEDIUM'}"></option>
    </select>

    <label for="category">Категория:</label>
    <input type="text" id="category" name="category">

    <button type="submit">Добавить</button>
</form>
</body>
</html>
