<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список задач</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px;
        }

        li {
            margin-bottom: 20px;
        }

        .completed .task-title,
        .completed .task-description {
            text-decoration: line-through;
        }

        form {
            margin: 10px 0;
        }

        label {
            display: block;
        }

        input {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<h1>Список задач</h1>

<p th:if="${tasks.isEmpty()}">Задач пока нет.</p>

<ul>
    <li th:each="task : ${tasks}" th:classappend="${task.completed} ? 'completed'">
        <div class="task-title" th:text="${task.title}"></div>
        <div class="task-description" th:text="${task.description}"></div>
        <div th:text="${task.completed} ? 'Выполнена' : 'Не выполнена'"></div>

        <form th:if="${!task.completed}"
              th:action="@{/updateTask/{id}(id=${task.id})}" method="post">
            <input type="hidden" name="completed" value="true">
            <button type="submit">Отметить выполненной</button>
        </form>

        <a th:href="@{/deleteTask/{id}(id=${task.id})}"
           onclick="return confirm('Удалить эту задачу?')">Удалить</a>
    </li>
</ul>

<h2>Добавить задачу</h2>
<form th:action="@{/addTask}" method="post">
    <label for="title">Название:</label>
    <input type="text" id="title" name="title" required>

    <label for="description">Описание:</label>
    <input type="text" id="description" name="description">

    <button type="submit">Добавить</button>
</form>
</body>
</html>
