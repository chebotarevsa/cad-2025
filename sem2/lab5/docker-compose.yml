name: raspisa-lab5
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: raspisa_lab5
      POSTGRES_USER: raspisa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Lab5!2026}
    ports:
      - "127.0.0.1:5545:5432"
    volumes:
      - lab5_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raspisa -d raspisa_lab5"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lab5_pgdata:
