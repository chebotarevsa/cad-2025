<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Изменение заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2 class="mb-4" th:text="'Изменение заказа #' + ${orderId}">Изменение заказа</h2>

<form th:action="@{/orders/{id}(id=${orderId})}" th:object="${orderForm}" method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label" for="status">Статус</label>
        <select id="status" class="form-select" th:field="*{status}" required>
            <option value="NEW">NEW</option>
            <option value="PAID">PAID</option>
            <option value="SHIPPED">SHIPPED</option>
            <option value="DELIVERED">DELIVERED</option>
            <option value="CANCELLED">CANCELLED</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="shippingAddress">Адрес доставки</label>
        <input id="shippingAddress" type="text" class="form-control" th:field="*{shippingAddress}">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a th:href="@{/orders}" class="btn btn-secondary">Отмена</a>
</form>
</body>
</html>
