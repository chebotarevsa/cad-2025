[versions]
junit-jupiter = "5.11.1"
spring-context = "6.2.2"
spring-data = "3.3.3"
hibernate = "6.4.4.Final"
hikari = "5.1.0"
h2 = "2.3.232"
logback = "1.5.16"

[libraries]
junit-jupiter   = { module = "org.junit.jupiter:junit-jupiter",         version.ref = "junit-jupiter" }
spring-context  = { module = "org.springframework:spring-context",       version.ref = "spring-context" }
spring-web      = { module = "org.springframework:spring-web",           version.ref = "spring-context" }
spring-orm      = { module = "org.springframework:spring-orm",           version.ref = "spring-context" }
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa", version.ref = "spring-data" }
hibernate-core  = { module = "org.hibernate.orm:hibernate-core",         version.ref = "hibernate" }
hikari          = { module = "com.zaxxer:HikariCP",                      version.ref = "hikari" }
h2              = { module = "com.h2database:h2",                        version.ref = "h2" }
logback-classic = { module = "ch.qos.logback:logback-classic",           version.ref = "logback" }
