<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Зоомагазин — Заказы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h1 class="mb-3">Список заказов</h1>

<a href="/orders/new" class="btn btn-primary mb-3">Создать заказ</a>

<div th:if="${orders.empty}" class="alert alert-info">Заказов пока нет.</div>

<table th:unless="${orders.empty}" class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>#</th>
        <th>Клиент</th>
        <th>Дата</th>
        <th>Сумма (руб.)</th>
        <th>Статус</th>
        <th>Адрес доставки</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${orders}">
        <td th:text="${o.orderId}"></td>
        <td th:text="${o.customer.name}"></td>
        <td th:text="${o.orderDate != null ? o.orderDate.toLocalDate() : '—'}"></td>
        <td th:text="${#numbers.formatDecimal(o.totalPrice, 1, 2)}"></td>
        <td>
            <span th:text="${o.status}"
                  th:classappend="${o.status == 'NEW'} ? 'badge bg-secondary'
                      : (${o.status == 'PROCESSING'} ? 'badge bg-primary'
                      : (${o.status == 'SHIPPED'} ? 'badge bg-info'
                      : (${o.status == 'DELIVERED'} ? 'badge bg-success'
                      : 'badge bg-danger')))">
            </span>
        </td>
        <td th:text="${o.shippingAddress}"></td>
        <td>
            <a th:href="@{/orders/{id}/edit(id=${o.orderId})}" class="btn btn-sm btn-warning me-1">Изменить</a>
            <form th:action="@{/orders/{id}/delete(id=${o.orderId})}" method="post" style="display:inline"
                  onsubmit="return confirm('Удалить заказ #' + [[${o.orderId}]] + '?')">
                <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
