<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2 class="mb-4">Заказы магазина зоотоваров</h2>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Клиент</th>
        <th>Дата</th>
        <th>Сумма</th>
        <th>Статус</th>
        <th>Адрес доставки</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.orderId}">1</td>
        <td th:text="${order.customer.name}">Клиент</td>
        <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>
        <td th:text="${order.totalPrice}">0</td>
        <td th:text="${order.status}">NEW</td>
        <td th:text="${order.shippingAddress}">Адрес</td>
        <td>
            <a th:href="@{/orders/{id}/edit(id=${order.orderId})}" class="btn btn-sm btn-outline-primary">Изменить</a>
            <form th:action="@{/orders/{id}/delete(id=${order.orderId})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/orders/new}" class="btn btn-primary">Создать заказ</a>
</body>
</html>
