<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Зоомагазин — Создать заказ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

<h1 class="mb-3">Создать заказ</h1>

<form th:action="@{/orders}" th:object="${orderForm}" method="post" style="max-width:600px">

    <div class="mb-3">
        <label for="customerId" class="form-label">Клиент</label>
        <select id="customerId" th:field="*{customerId}" class="form-select" required>
            <option value="">— выберите клиента —</option>
            <option th:each="c : ${customers}"
                    th:value="${c.customerId}"
                    th:text="${c.name}">Клиент</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="productIds" class="form-label">Товары <small class="text-muted">(Ctrl/Cmd для выбора нескольких)</small></label>
        <select id="productIds" th:field="*{productIds}" class="form-select" multiple size="8">
            <option th:each="p : ${products}"
                    th:value="${p.productId}"
                    th:text="${p.name + ' — ' + p.price + ' руб.'}">Товар</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="shippingAddress" class="form-label">Адрес доставки</label>
        <input type="text" id="shippingAddress" th:field="*{shippingAddress}"
               class="form-control" placeholder="Город, улица, дом" required>
    </div>

    <button type="submit" class="btn btn-primary">Создать заказ</button>
    <a href="/orders" class="btn btn-secondary ms-2">Отмена</a>
</form>

</body>
</html>
