<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Orders</h1>
        <div>
            <a class="btn btn-outline-secondary me-2" th:href="@{/logout}">Logout</a>
            <a class="btn btn-primary" th:if="${isManager}" th:href="@{/orders/new}">Create Order</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Total</th>
            <th>Status</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customer != null ? order.customer.name : 'Unknown'}"></td>
            <td th:text="${order.orderDate}"></td>
            <td th:text="${order.totalPrice}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${order.shippingAddress}"></td>
            <td>
                <div th:if="${isManager}">
                    <a class="btn btn-sm btn-secondary" th:href="@{/orders/{id}/edit(id=${order.orderId})}">Edit</a>
                    <form th:action="@{/orders/{id}/delete(id=${order.orderId})}" method="post" style="display:inline-block; margin-left: 8px;">
                        <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                    </form>
                </div>
                <span th:if="${!isManager}">View only</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
